<!DOCTYPE html>
<html>
<head>
    <title>List Gemini Models</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; overflow-x: auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Available Gemini Models</h1>
    <p>Enter your API key and click to see available models:</p>

    <input type="text" id="apiKey" placeholder="Your Gemini API Key" style="width: 400px; padding: 8px; margin-bottom: 10px;">
    <br>
    <button onclick="listModels()">List Available Models</button>

    <div id="result" style="margin-top: 20px;"></div>

    <script>
        async function listModels() {
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                document.getElementById('result').innerHTML = '<p style="color: red;">Please enter an API key</p>';
                return;
            }

            document.getElementById('result').innerHTML = '<p>Loading...</p>';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);

                if (!response.ok) {
                    const error = await response.text();
                    document.getElementById('result').innerHTML = `<p style="color: red;">Error: ${response.status}</p><pre>${error}</pre>`;
                    return;
                }

                const data = await response.json();

                let html = '<h2>✅ Available Models:</h2>';

                if (data.models && data.models.length > 0) {
                    html += '<ul>';
                    data.models.forEach(model => {
                        const supportsGenerate = model.supportedGenerationMethods?.includes('generateContent');
                        html += `<li>
                            <strong>${model.name}</strong>
                            ${supportsGenerate ? '✅ (supports generateContent)' : '❌ (no generateContent)'}
                            <br><small>${model.description || 'No description'}</small>
                        </li>`;
                    });
                    html += '</ul>';
                } else {
                    html += '<p>No models found</p>';
                }

                html += '<h3>Full Response:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';

                document.getElementById('result').innerHTML = html;
            } catch (error) {
                document.getElementById('result').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
